<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="540" cy="60" r="90" fill="rgba(255,255,255,0.07)"/>
  <circle cx="60" cy="350" r="70" fill="rgba(255,255,255,0.07)"/>

  <!-- Browser window -->
  <rect x="40" y="40" width="520" height="320" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="40" y="40" width="520" height="36" rx="12" fill="rgba(0,0,0,0.25)"/>
  <rect x="40" y="64" width="520" height="12" fill="rgba(0,0,0,0.25)"/>
  <circle cx="66" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="86" cy="58" r="6" fill="#febc2e"/>
  <circle cx="106" cy="58" r="6" fill="#28c840"/>
  <rect x="130" y="50" width="300" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>

  <!-- Top nav -->
  <rect x="40" y="76" width="520" height="40" fill="rgba(0,0,0,0.25)"/>
  <text x="120" y="101" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">🎓 Student Counselling</text>
  <rect x="430" y="84" width="110" height="24" rx="12" fill="rgba(139,92,246,0.8)"/>
  <text x="485" y="100" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Book Session</text>

  <!-- Dashboard cards row -->
  <rect x="55" y="130" width="140" height="70" rx="8" fill="rgba(255,255,255,0.12)"/>
  <text x="125" y="158" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">📅</text>
  <text x="125" y="178" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Appointments</text>
  <text x="125" y="192" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">12</text>

  <rect x="210" y="130" width="140" height="70" rx="8" fill="rgba(255,255,255,0.12)"/>
  <text x="280" y="158" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">👨‍🏫</text>
  <text x="280" y="178" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Counsellors</text>
  <text x="280" y="192" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">8</text>

  <rect x="365" y="130" width="140" height="70" rx="8" fill="rgba(255,255,255,0.12)"/>
  <text x="435" y="158" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">✅</text>
  <text x="435" y="178" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Sessions Done</text>
  <text x="435" y="192" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">340</text>

  <!-- Appointment list -->
  <rect x="55" y="215" width="250" height="130" rx="8" fill="rgba(0,0,0,0.2)"/>
  <text x="180" y="235" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Upcoming Sessions</text>
  <rect x="65" y="242" width="230" height="28" rx="4" fill="rgba(255,255,255,0.1)"/>
  <text x="80" y="260" font-family="Arial,sans-serif" font-size="10" fill="white">🕐 10:00 AM · Dr. Sharma</text>
  <rect x="65" y="276" width="230" height="28" rx="4" fill="rgba(255,255,255,0.1)"/>
  <text x="80" y="294" font-family="Arial,sans-serif" font-size="10" fill="white">🕑 02:00 PM · Dr. Reddy</text>
  <rect x="65" y="310" width="230" height="28" rx="4" fill="rgba(255,255,255,0.1)"/>
  <text x="80" y="328" font-family="Arial,sans-serif" font-size="10" fill="white">🕓 04:30 PM · Dr. Kumar</text>

  <!-- Form panel -->
  <rect x="320" y="215" width="185" height="130" rx="8" fill="rgba(0,0,0,0.2)"/>
  <text x="412" y="235" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Quick Book</text>
  <rect x="330" y="242" width="165" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="340" y="256" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Select Counsellor...</text>
  <rect x="330" y="268" width="165" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="340" y="282" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Select Date &amp; Time...</text>
  <rect x="330" y="294" width="165" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="340" y="308" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Your concern...</text>
  <rect x="355" y="320" width="115" height="22" rx="11" fill="rgba(139,92,246,0.9)"/>
  <text x="412" y="335" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle">Confirm Booking</text>

  <!-- Label -->
  <rect x="0" y="360" width="600" height="40" fill="rgba(0,0,0,0.4)"/>
  <text x="300" y="386" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Student Counselling Platform · Python · Django · PostgreSQL</text>
</svg>