<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7931e"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="520" cy="60" r="80" fill="rgba(255,255,255,0.08)"/>
  <circle cx="80" cy="340" r="60" fill="rgba(255,255,255,0.08)"/>

  <!-- Mock browser window -->
  <rect x="40" y="40" width="520" height="320" rx="12" fill="url(#card)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Browser bar -->
  <rect x="40" y="40" width="520" height="36" rx="12" fill="rgba(0,0,0,0.25)"/>
  <rect x="40" y="64" width="520" height="12" fill="rgba(0,0,0,0.25)"/>
  <circle cx="66" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="86" cy="58" r="6" fill="#febc2e"/>
  <circle cx="106" cy="58" r="6" fill="#28c840"/>
  <rect x="130" y="50" width="300" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>

  <!-- Nav bar mock -->
  <rect x="40" y="76" width="520" height="44" fill="rgba(0,0,0,0.3)"/>
  <rect x="60" y="88" width="60" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="140" y="92" width="40" height="12" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="195" y="92" width="40" height="12" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="250" y="92" width="40" height="12" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="460" y="86" width="80" height="24" rx="12" fill="rgba(255,107,53,0.8)"/>

  <!-- Hero section mock -->
  <rect x="40" y="120" width="520" height="140" fill="rgba(0,0,0,0.2)"/>
  <text x="300" y="175" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">🍽️ Fine Dining</text>
  <text x="300" y="205" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">Experience the finest cuisine in town</text>
  <rect x="230" y="220" width="140" height="28" rx="14" fill="rgba(255,107,53,0.9)"/>
  <text x="300" y="239" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">Reserve a Table</text>

  <!-- Menu cards mock -->
  <rect x="55" y="272" width="140" height="72" rx="8" fill="rgba(255,255,255,0.12)"/>
  <rect x="215" y="272" width="140" height="72" rx="8" fill="rgba(255,255,255,0.12)"/>
  <rect x="375" y="272" width="140" height="72" rx="8" fill="rgba(255,255,255,0.12)"/>
  <text x="125" y="310" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">🥗</text>
  <text x="285" y="310" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">🍝</text>
  <text x="445" y="310" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">🍰</text>
  <text x="125" y="330" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">Starters</text>
  <text x="285" y="330" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">Main Course</text>
  <text x="445" y="330" font-family="Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">Desserts</text>

  <!-- Label -->
  <rect x="0" y="360" width="600" height="40" fill="rgba(0,0,0,0.4)"/>
  <text x="300" y="386" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Advanced Restaurant Website · HTML5 · CSS3 · JavaScript</text>
</svg>